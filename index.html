<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블로그 사진</title>
<meta name="theme-color" content="#03c75a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="블로그 사진">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>블로그 사진</h1>
  <button id="bell" class="ghost" hidden>🔔 알림 켜기</button>
</header>

<main>
  <!-- 로그인(처음 1번) -->
  <section id="v-login" hidden>
    <p class="muted">처음 한 번만 로그인하면 계속 유지됩니다.</p>
    <form id="login-form">
      <input id="email" type="email" autocomplete="username" placeholder="이메일" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      <button class="primary" type="submit">로그인</button>
    </form>
    <p id="login-msg" class="err"></p>
  </section>

  <!-- ① 사진 올리기 -->
  <section id="v-upload" hidden>
    <label class="pick">
      <input id="files" type="file" accept="image/*" multiple>
      <span id="pick-text">📷 사진 고르기 (시공 1건, 최대 20장)</span>
    </label>
    <div id="thumbs" class="thumbs"></div>
    <button id="send" class="primary big" disabled>올리기</button>
    <progress id="bar" max="100" value="0" hidden></progress>
    <p id="up-msg" class="muted"></p>
    <p id="ios-tip" class="tip" hidden>아이폰은 공유 버튼 → "홈 화면에 추가"로 앱처럼 설치해야 알림을 받을 수 있습니다.</p>
  </section>

  <!-- ② 진행 상황 -->
  <section id="v-jobs" hidden>
    <ul id="jobs" class="jobs"></ul>
    <p id="jobs-empty" class="muted" hidden>아직 올린 사진이 없습니다.</p>
  </section>

  <!-- ③ 글 미리보기 -->
  <section id="v-preview" hidden>
    <a href="#jobs" class="back">← 진행 상황</a>
    <div id="pv-info" class="info"></div>
    <button id="copy" class="primary">📋 글 복사</button>
    <article id="pv"></article>
  </section>
</main>

<nav id="tabs" hidden>
  <a href="#upload" data-v="upload">📷<span>사진 올리기</span></a>
  <a href="#jobs" data-v="jobs">⏳<span>진행 상황</span></a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
